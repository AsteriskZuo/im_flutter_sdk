name: im_flutter_sdk
description: Integrate the Chat SDK to enjoy the global IM services with high reliability, ultra-low latency, and high concurrency.
version: 1.15.0-ohos
homepage: https://www.easemob.com

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

  im_flutter_sdk_interface: ^4.25.0

  im_flutter_sdk_ohos: 1.15.0-ohos


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0



flutter:
  plugin:
    platforms:
      ohos:
        default_package: im_flutter_sdk_ohos
